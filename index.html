<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="2N4bL2ab6CJjtIUDIqw9I63x4ELKokbe3ZTxn4U8uQg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Family Organizer</title>
    <meta name="theme-color" content="#f3f0e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="Family" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <script>
      // Last time's theme, text size and highlight color (saved by App.tsx), so the page doesn't
      // open in the default look and switch a moment later.
      try {
        var look = JSON.parse(localStorage.getItem('look') || 'null')
        if (look) {
          var root = document.documentElement
          if (look.theme) root.dataset.theme = look.theme
          if (look.textSize) root.dataset.textSize = look.textSize
          if (look.density) root.dataset.density = look.density
          for (var k in look.vars || {}) root.style.setProperty(k, look.vars[k])
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
