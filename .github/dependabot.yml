# Monthly, grouped dependency updates (each update run uses Actions minutes).
# GitHub runs no other checks: run `npm run verify` locally before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      web:
        patterns: ['*']
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: monthly
    groups:
      functions:
        patterns: ['*']
        update-types: [minor, patch]
    open-pull-requests-limit: 5

