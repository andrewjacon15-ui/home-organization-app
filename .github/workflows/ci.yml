# Every pull request and every push to main: lint, typecheck, all three test suites,
# both builds with a bundle budget, cost and repository guards, and a production
# dependency audit. Branch protection can require
# the "CI passed" job.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm ci --prefix functions
      - name: Lint (web + functions typecheck)
        run: npm run lint
      - name: Web tests
        run: npm run test:web
      - name: Functions tests
        run: npm run test:functions
      # The tablet's speech model (~41 MB, checked by SHA-256 in scripts/fetch-voice.mjs) is fetched once, then cached.
      - name: Cache the tablet voice model
        uses: actions/cache@v6
        with:
          path: .cache/voice
          key: voice-${{ hashFiles('scripts/fetch-voice.mjs') }}
      - name: Web build (tsc + vite)
        run: npm run build
      - name: Bundle budget (size, no emulator hosts, no source maps)
        run: npm run check:bundle
      - name: Functions build
        run: npm run build --prefix functions

  rules:
    name: Security rules (Firestore + Storage emulators)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Cache emulator downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Rules tests
        run: npm run test:rules

  guards:
    name: Cost and repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Free-tier guards (scheduler jobs, scaling, memory, paid APIs, TTLs, upload caps, caching)
        run: npm run check:costs
      - name: Repository hygiene (file sizes, media, secrets)
        run: npm run check:repo

  audit:
    name: Dependency audit (production)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Web app
        run: npm audit --omit=dev --audit-level=moderate
      - name: Cloud Functions
        run: npm audit --omit=dev --audit-level=moderate --prefix functions

  passed:
    name: CI passed
    if: always()
    needs: [app, rules, guards, audit]
    runs-on: ubuntu-24.04
    steps:
      - name: All jobs succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A required job failed or was cancelled." && exit 1
          fi
